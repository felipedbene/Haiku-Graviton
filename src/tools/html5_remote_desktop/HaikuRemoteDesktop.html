<!DOCTYPE html>
<html>
	<head>
		<title>Haiku Remote Desktop</title>
		<script src="HaikuRemoteDesktop.js"></script>
		<style type="text/css">
			html, body {
				margin: 0;
				padding: 0;
				height: 100%;
			}

			body, #connectForm {
				display: flex;
			}

			body {
				font-family: sans;
				align-items: flex-start;
				justify-content: center;
			}

			#connectForm {
				flex-direction: column;
				align-items: flex-start;
			}

			#connectForm div {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				width: 100%;
			}

			input, button {
				margin: 1em;
			}

			input[type=number] {
				width: 5em;
			}

			button {
				align-self: flex-end;
			}

			.session {
				display: none;
			}

			body.connect .session {
				display: initial;
			}

			body.connect #connectForm {
				display: none;
			}
		</style>
	</head>
	<body onload="init();">
		<div id="connectForm">
			<!-- The normal front door is the remote_broker daemon on the
			     server: wss://<host>:10902 plus the authentication token
			     from its settings directory. With the default self-signed
			     certificate the browser must trust it once first: open
			     https://<host>:10902/ in a tab, inspect the certificate
			     (compare against the server's broker.fingerprint) and
			     accept it, then connect here. A ws://localhost:<port>
			     address still works for the loopback/SSH-tunnel rescue
			     path (via websockify); no token is needed there. -->
			<div>
				<label for="targetAddress">Remote Host</label>
				<input type="text" id="targetAddress"
					value="wss://localhost:10902" />
			</div>
			<div>
				<label for="token">Token</label>
				<input type="password" id="token" value="" />
			</div>
			<div>
				<label for="width">Width</label>
				<input type="number" id="width" value="800" />
				<label for="height">Height</label>
				<input type="number" id="height" value="600" />
			</div>
			<button id="connectButton" autofocus>Connect</button>
		</div>
	</body>
</html>
