version: 0.2

# Test stage: self-provision an ephemeral peer from the canonical AMI, boot the
# freshly registered candidate AMI on real Graviton hardware, measure throughput
# between them, then stop and start the candidate and require sshd to answer
# again. Fail if any of that regressed. Both instances are torn down on exit.
#
# This sits between Register and Approve on purpose. Before it existed, the
# approval gate could only mean "I tested this out of band and I vouch for it" --
# nothing in the pipeline knew whether the image booted, whether jumbo still
# negotiated, or whether throughput had halved. Now the approver is looking at
# numbers taken minutes earlier on the actual image.
#
# All the logic lives in graviton/scripts/haiku-perf-gate so it can be run by
# hand against any AMI, which is how it gets debugged. Keeping the buildspec thin
# matches the other stages here.
#
# AMI_ID is injected from the Register stage's exported pipeline variable.

phases:
  install:
    commands:
      # The gate drives the builder over SSM and parses text; nothing else needed.
      - set -euo pipefail
  build:
    commands:
      - set -euo pipefail
      - |
        test -n "${AMI_ID:-}" || { echo "AMI_ID not provided by the Register stage" >&2; exit 1; }
      - export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"
      # Per-run discriminator, shared by the gate (which stamps it as a `run-id` tag
      # on both instances it launches) and by the straggler sweep below (which must
      # only sweep THIS run's instances). Without it the sweep selects on
      # Name+ephemeral alone and would terminate a concurrently running gate's
      # candidate -- routine now that the oven runs executions in PARALLEL.
      - export HG_RUN_ID="$CODEBUILD_BUILD_ID"
      # Machine-readable sidecar the gate writes its measurements and verdict to,
      # stamped onto the AMI as tags in post_build (pass or fail).
      - export HG_RESULT_FILE=/tmp/haiku-perf-gate-result
      - echo "== performance gate for $AMI_ID =="
      - bash "$CODEBUILD_SRC_DIR/graviton/scripts/haiku-perf-gate" "$AMI_ID"
  post_build:
    commands:
      # Record the gate's outcome on the AMI itself, on BOTH paths. This is what
      # makes a candidate selectable later: `perf-gate`, `perf-rx-mbps`,
      # `perf-tx-mbps`, `perf-mtu` and `perf-gate-at` travel with the image, so
      # choosing which tested candidate to promote does not depend on a CodeBuild log
      # that has aged out. Best-effort: the script always exits 0, because the
      # verdict has already been delivered by the gate's exit status and a tagging
      # blip must not turn a good bake red.
      - |
        bash "$CODEBUILD_SRC_DIR/graviton/pipeline/scripts/tag-gate-result.sh" \
          "${AMI_ID:-}" "${CODEBUILD_BUILD_SUCCEEDING:-0}" \
          "${HG_RESULT_FILE:-/tmp/haiku-perf-gate-result}" || true
      # haiku-perf-gate terminates its instance from an EXIT trap, so a failure
      # above has already cleaned up. This is a belt-and-braces sweep for the
      # case where the container itself was killed mid-run and the trap never
      # fired -- an ephemeral gate instance must never outlive its build.
      #
      # stopping/stopped are in the state list because the gate now deliberately
      # cycles the instance: a container killed during the stop/start check leaves
      # a gate instance parked in one of those states, where it is easy to forget
      # and still bills for its EBS volume.
      #
      # SCOPED TO THIS RUN by the run-id tag. Name+ephemeral alone matches every
      # gate instance in the account, so this sweep used to be safe only because at
      # most one gate could be in flight: under the oven's PARALLEL execution mode
      # (and already, latently, across the trunk and variant pipelines) it would
      # terminate a sibling run's candidate mid-measurement and the victim would
      # report a hardware failure that never happened. The run-id is refused rather
      # than defaulted: sweeping "everything" is the bug, so an unset discriminator
      # must sweep nothing.
      - |
        set +e
        if [ -z "${HG_RUN_ID:-}" ]; then
          echo "no HG_RUN_ID; skipping the straggler sweep rather than sweeping every gate instance"
          exit 0
        fi
        stragglers=$(aws --region "${AWS_REGION:-$AWS_DEFAULT_REGION}" ec2 describe-instances \
          --filters "Name=tag:Name,Values=haiku-perf-gate" "Name=tag:ephemeral,Values=true" \
                    "Name=tag:run-id,Values=$HG_RUN_ID" \
                    "Name=instance-state-name,Values=running,pending,stopping,stopped" \
          --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null)
        if [ -n "$stragglers" ]; then
          echo "sweeping leaked gate instances: $stragglers"
          aws --region "${AWS_REGION:-$AWS_DEFAULT_REGION}" ec2 terminate-instances \
            --instance-ids $stragglers >/dev/null 2>&1
        fi
        exit 0
