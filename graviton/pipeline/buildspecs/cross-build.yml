version: 0.2

# Cross-build stage: reproduce the manual bake recipe on a CodeBuild arm64
# (Graviton) worker running arm64 Ubuntu 24.04.
#
#   configure --build-cross-tools arm64  (cached in S3 to skip the ~1h rebuild)
#   graviton/ssh/build-openssh-arm64.sh  (cross-build OpenSSH -> hpkg)
#   cp graviton/ssh/UserBuildConfig      (jam injection hook)
#   jam @minimum-mmc                     (two passes: stage packages, then inject)
#   make-gpt-image.sh                    (MBR mmc -> GPT raw)
#
# The source artifact is the Haiku tree itself, so $CODEBUILD_SRC_DIR is HAIKU_TOP.
# Everything below only *reads* the recipe from graviton/ — no logic is rewritten.

env:
  variables:
    GEN_SUBDIR: "generated.arm64"

phases:
  install:
    commands:
      - export DEBIAN_FRONTEND=noninteractive
      - apt-get update -qq
      # Haiku cross-tools + jam build prerequisites, plus sgdisk (make-gpt-image),
      # rsync/sudo/attr (build-openssh sysroot staging), and the awscli for cache.
      - >-
        apt-get install -y --no-install-recommends
        git build-essential g++ make bison flex gawk nasm
        wget curl xz-utils zstd zlib1g-dev libzstd-dev libtool autoconf automake texinfo
        gettext python3 python-is-python3 gdisk rsync sudo attr ca-certificates
        unzip file
      # awscli v2 (arm64) for pulling/pushing the cross-tools cache.
      - curl -sSLf "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o /tmp/awscliv2.zip
      - (cd /tmp && unzip -q awscliv2.zip && ./aws/install)
  pre_build:
    commands:
      - set -euo pipefail
      - export HAIKU_TOP="$CODEBUILD_SRC_DIR"
      - export GEN="$HAIKU_TOP/$GEN_SUBDIR"
      - echo "HAIKU_TOP=$HAIKU_TOP  GEN=$GEN"
      # buildtools (arm64 cross-tools sources) alongside the Haiku tree.
      - git clone --depth 1 --branch "$BUILDTOOLS_BRANCH" "$BUILDTOOLS_REPO" "$HAIKU_TOP/../buildtools"
      - export BUILDTOOLS="$HAIKU_TOP/../buildtools"
      # jam is not preinstalled in the CodeBuild image; build + install Haiku's
      # jam from buildtools so the @minimum-mmc build below can find it on PATH.
      - |
        if ! command -v jam >/dev/null 2>&1; then
          echo "== build + install jam from buildtools =="
          (cd "$BUILDTOOLS/jam" && make && ./jam0 install)
          command -v jam || { echo "jam still not on PATH after install" >&2; exit 1; }
        fi
      # Try to restore a cross-tools cache to skip the ~1h build. The cache key is
      # KEYED BY THE BUILDTOOLS REVISION (short HEAD of the clone above): a repoint
      # or toolchain bump (e.g. binutils 2.41 -> 2.46.1, issue #89) moves buildtools
      # to a new commit, which yields a different cache object, misses the restore,
      # and forces the ~1h rebuild against the new sources. A fixed key would
      # silently restore the STALE cross-tools and skip the rebuild, defeating the
      # bump. This makes every toolchain bump self-invalidating -- no manual bust.
      - BT_SHA="$(git -C "$HAIKU_TOP/../buildtools" rev-parse --short HEAD)"
      - echo "buildtools HEAD=$BT_SHA"
      - CT_CACHE="s3://$WORK_BUCKET/$CACHE_PREFIX/cross-tools-arm64-${BT_SHA}.tar.zst"
      - mkdir -p "$GEN"
      - |
        if aws s3 cp "$CT_CACHE" /tmp/ct.tar.zst --region "$AWS_DEFAULT_REGION" 2>/dev/null; then
          echo "== restoring cross-tools cache ($CT_CACHE) =="
          tar --zstd -xf /tmp/ct.tar.zst -C "$GEN"
          export HAVE_CROSS_TOOLS=1
        else
          echo "== no cross-tools cache for buildtools $BT_SHA; will build from source (~1h) =="
          export HAVE_CROSS_TOOLS=0
        fi
      # Persist both HAVE_CROSS_TOOLS and the keyed CT_CACHE for later phases (env
      # exports do not survive across CodeBuild phases -- post_build sources this to
      # refresh the SAME keyed object).
      - printf 'HAVE_CROSS_TOOLS=%s\nCT_CACHE=%s\n' "$HAVE_CROSS_TOOLS" "$CT_CACHE" > /tmp/ct.env
  build:
    commands:
      - set -euo pipefail
      - export HAIKU_TOP="$CODEBUILD_SRC_DIR"
      - export GEN="$HAIKU_TOP/$GEN_SUBDIR"
      - export BUILDTOOLS="$HAIKU_TOP/../buildtools"
      - . /tmp/ct.env
      - NPROC="$(nproc)"
      - cd "$GEN"
      # ---- configure -----------------------------------------------------
      - |
        if [ "$HAVE_CROSS_TOOLS" = "1" ] && [ -x "$GEN/cross-tools-arm64/bin/aarch64-unknown-haiku-gcc" ]; then
          echo "== configure (reuse cached cross-tools) =="
          "$HAIKU_TOP/configure" \
            --cross-tools-prefix "$GEN/cross-tools-arm64/bin/aarch64-unknown-haiku-" \
            --use-gcc-pipe -j"$NPROC"
        else
          echo "== configure --build-cross-tools arm64 (this is the ~1h step) =="
          "$HAIKU_TOP/configure" \
            --build-cross-tools arm64 \
            --cross-tools-source "$BUILDTOOLS" \
            --use-gcc-pipe -j"$NPROC"
        fi
      # ---- stage local packages -> turn ON the openssl build feature -----
      # LEAN MODULAR BAKE. This branch bakes a lean image (~@minimum footprint):
      # it stages ONLY the small openssl pool (openssl3/openssl3_devel/zstd) so
      # the openssl/TLS build feature turns on, and it deliberately does NOT set
      # HG_FATTY, so UserBuildConfig force-adds none of the WebKit/Rust/dev
      # closure -- every fatty feature is installed on demand from the baked
      # DeBeOS repo instead. haiku-stage-local-packages will report the other
      # HaikuPortsLocal entries as "MISSING in pool" and exit 1; that is
      # expected and tolerated (their build features simply stay off). Its
      # exit 2 -- a wrong vendor -- is NOT tolerated; see the call site below.
      # (A FATTY bake would sync s3://$WORK_BUCKET/hpkg-pool/ and export HG_FATTY=1.)
      - export HG_POOL_DIR="$HAIKU_TOP/hpkg-pool"
      - mkdir -p "$HG_POOL_DIR"
      # Pull ONLY the lean set (openssl3 + openssl3_devel + zstd) out of the
      # granted hpkg-pool/ prefix. The CrossBuild role's grantRead covers
      # hpkg-pool/* but NOT a separate hpkg-pool-lean/* prefix, so syncing a
      # dedicated lean prefix 403s (s3:GetObject AccessDenied) and silently
      # drops openssl3 -- then "AddHaikuImagePackages: package openssl3 not
      # available!", the openssl/TLS build feature never turns on, and
      # BSecureSocket ships as the B_UNSUPPORTED stub (https "Operation not
      # supported"). Filtering the already-granted pool keeps the image lean
      # (3 packages, not the full ~69) without an IAM/pipeline redeploy.
      # ca_root_certificates-2026_07_16-1 IS staged, and the reason it is safe
      # now is that it is also DECLARED, in
      # build/jam/repositories/HaikuPortsLocal/arm64. That distinction is the
      # whole of the old warning this replaces. Staging the newer pool copy
      # WITHOUT declaring it is what produced the skew: the by-name
      # AddHaikuImageSystemPackages resolved the *index* version (2025_12_02,
      # repositories/HaikuPorts/arm64:6) while the newer file sat unreferenced
      # beside it, so the package ended up present-but-not-activated -- no
      # CARootCertificates.pem, TLS verify failing B_NOT_ALLOWED. Declared in
      # HaikuPortsLocal it is an ordinary member of the same HaikuPorts
      # repository as the index, so the solver sees two versions of one package,
      # picks the newer, and jam copies and activates that one -- exactly how
      # openssl3 and zstd already work. It has to move, not merely may:
      # openssl3-3.5.9-2 requires `ca_root_certificates >= 2026_07_16` (read out
      # of the hpkg with graviton/scripts/hpkg_meta.py, not out of the recipe --
      # haikuporter stamps the floor from whatever was installed on the builder
      # that linked it), and the index serves only 2025_12_02-1.
      # Same story for zlib: that pin carries `lib:libz >= 1.3.2`, the index
      # serves only zlib-1.2.13_bootstrap-1 (:42-43), and nothing else in the
      # set provides lib:libz, so the image solver reports "nothing provides
      # lib:libz>=1.3.2 needed by openssl3-3.5.9-2". zlib and zlib_devel move as
      # a pair -- zlib_devel-1.2.13_bootstrap-1 requires `zlib == 1.2.13`
      # exactly (the issue-708 exact-pin shape), so a newer runtime zlib without
      # its matching devel package is unsatisfiable.
      # NO fallback on this sync (issue #419): it used to end in
      # `|| echo "no lean hpkg pool"`, which swallowed BOTH a real sync error
      # and -- worse -- a filter that matched nothing. When this pipeline's
      # pool went stale (it predated amazon_ssm_agent in the trunk pool), the
      # include filter matched zero objects, the fallback printed its line, and
      # the bake "succeeded" into an AMI with no SSM agent at all. Under the
      # phase-wide `set -euo pipefail` a sync failure now fails the build, and
      # the must-have check below refuses to continue when a critical package
      # did not land, whatever the reason (stale pool, filter typo, 403).
      # The image translator libraries (libpng16/libjpeg_turbo/jasper/tiff, each
      # runtime + _devel) are staged too: their build features
      # (build/jam/BuildFeatures) gate on IsPackageAvailable <lib>_devel, which
      # is true only once the exact-named *_devel hpkg lands in the build's
      # download dir. Omit them and FFilterByBuildFeatures silently strips
      # PNGTranslator@libpng and its @jpeg/@tiff/@jasper siblings from the image
      # -- the lean canonical AMI shipped with no PNG translator for exactly this
      # reason. The names/versions match the HaikuPortsLocal/arm64 list and the
      # "Haiku Project"-vendored files in hpkg-pool/. (libwebp/libavif are not
      # staged -- see the HaikuPortsLocal/arm64 note: no "Haiku Project"-vendored
      # libwebp_devel and no libavif >= 1.0 exist for arm64 yet.)
      # ncurses6 is synced for issue 784: UserBuildConfig force-adds the
      # non-bootstrap ncurses6-6.6-1 into system/packages so the terminfo lookup
      # path on the image exists. That force-add reads the file out of
      # $HG_POOL_DIR, so without this include the pin is inert -- which is how it
      # shipped: the entry landed inside UserBuildConfig's `if $(HG_FATTY)`
      # block, which no buildspec enters, and the sync filter would have dropped
      # the file anyway. The glob is deliberately loose here and exact there:
      # `ncurses6-*` is disjoint from `ncurses6_devel-*`, and the Glob in
      # UserBuildConfig demands the precise revision, so a bootstrap-versioned
      # file reaching the pool is ignored rather than baked.
      # openssl3_man needs its OWN include, and that is the trap worth naming:
      # these globs anchor on the hyphen, so `openssl3-*` matches
      # openssl3-3.5.9-2-arm64.hpkg and does NOT match
      # openssl3_man-3.5.9-2-any.hpkg -- the same reason openssl3_devel is
      # listed separately. Copying the man hpkg into hpkg-pool/ therefore did
      # nothing on its own: the file sat in the bucket and never reached
      # $HG_POOL_DIR. Adding a package to a pool is two steps, the upload and
      # the include, and the sync is silent about the half that is missing.
      - aws s3 sync "s3://$WORK_BUCKET/hpkg-pool/" "$HG_POOL_DIR/" --region "$AWS_DEFAULT_REGION" --exclude "*" --include "ncurses6-*" --include "openssl3-*" --include "openssl3_devel-*" --include "openssl3_man-*" --include "zstd-*" --include "zstd_devel-*" --include "zstd_source-*" --include "zlib-*" --include "zlib_devel-*" --include "ca_root_certificates-*" --include "amazon_ssm_agent-*" --include "debeos_cloudwatch-*" --include "fluidlite-*" --include "fluidlite_devel-*" --include "libvorbis-*" --include "libvorbis_devel-*" --include "libpng16-*" --include "libpng16_devel-*" --include "libjpeg_turbo-*" --include "libjpeg_turbo_devel-*" --include "jasper-*" --include "jasper_devel-*" --include "tiff-*" --include "tiff_devel-*"
      - |
        # Must-have packages: the image is WRONG without these, so their
        # absence fails the bake loudly instead of shipping a quiet regression.
        #   amazon_ssm_agent / debeos_cloudwatch -- the instance boots and sshd
        #     works but it never registers as an SSM managed node and emits no
        #     metrics (the exact #419 failure mode);
        #   openssl3(+devel) / zstd(+devel,source) -- their build features
        #     silently turn off and BSecureSocket ships as the B_UNSUPPORTED
        #     stub / the kernel zstd support cannot compile.
        # fluidlite/libvorbis are optional media features: if un-staged their
        # features just stay off, so they are deliberately NOT in this list.
        # This also retires the old "empty hpkg pool; SSH-only image" branch:
        # an empty pool was only ever a mis-seeded work bucket, never a wanted
        # image flavor.
        #   libpng16/libjpeg_turbo/jasper/tiff (+ _devel) -- the image
        #     translator libs. Each _devel gates its build feature; without it
        #     FFilterByBuildFeatures strips PNGTranslator@libpng and its
        #     @jpeg/@tiff/@jasper siblings and the image ships with no
        #     PNG/JPEG/JPEG2000/TIFF translator (the lean-canonical gap).
        #     Listed here so a stale/incomplete pool fails the bake loudly
        #     instead of quietly shipping a feature-capped image again.
        # Check the EXACT pinned filename, not just the package name. A
        # name-only glob is satisfied by any version in the pool, so bumping a
        # pin in HaikuPortsLocal/arm64 ahead of the pool passed this guard and
        # then lost the package anyway: haiku-stage-local-packages matches names
        # exactly, revision included, so it reported the pinned file "MISSING in
        # pool", exited 1 (tolerated below), and the dependent build feature
        # stayed off -- which is the feature-capped image this guard exists to
        # prevent. Measured: the openssl3 pin moved to 3.5.9-2 while every bake
        # pool still held only 3.5.7-1, and `ls openssl3-[0-9]*.hpkg` matched the
        # 3.5.7 file and said nothing.
        # amazon_ssm_agent/debeos_cloudwatch are not pinned in HaikuPortsLocal
        # (UserBuildConfig picks them up by Glob), so they keep the name-only
        # check. amazon_ssm_agent then gets the stricter provenance check below.
        # zlib/zlib_devel and ca_root_certificates are must-haves for the same reason
        # openssl3 and zstd are: the openssl3 pin's own metadata requires
        # `lib:libz >= 1.3.2` and `ca_root_certificates >= 2026_07_16`, and
        # neither floor can be met from the checksummed index, so a pool missing
        # them does not degrade gracefully -- the image solver has no candidate
        # at all and the bake dies mid-image (measured in a quic-oven bake).
        # ca_root_certificates is an "any"-architecture package, so the pinned
        # file is -any.hpkg, not -arm64.hpkg: test both suffixes rather than
        # assuming the primary arch, or the guard reports a package that is
        # sitting right there.
        # openssl3_man is the other "any" package, and it is a must-have for the
        # silent-skip reason rather than a boot-breaking one: it reaches the
        # image through DefaultBuildProfiles' by-name AddHaikuImageSystemPackages
        # in the minimum-* profile, and that call drops a package it cannot
        # resolve without saying so. Its version is pinned in HaikuPortsLocal
        # with an exact `openssl3 == 3.5.9` dependency, so pin and pool have to
        # move together exactly as they do for openssl3 itself. Same treatment as
        # libpng16/jasper/tiff above, which are likewise not fatal to booting --
        # a declared pin the pool does not carry is a mis-seed, and the whole
        # point of this guard is that a mis-seed fails here rather than shipping
        # a quietly feature-stripped image.
        missing=""
        for pkg in amazon_ssm_agent debeos_cloudwatch openssl3 openssl3_devel openssl3_man zstd zstd_devel zstd_source \
                   zlib zlib_devel ca_root_certificates \
                   libpng16 libpng16_devel libjpeg_turbo libjpeg_turbo_devel jasper jasper_devel tiff tiff_devel; do
          pin=""
          if [ -f "$HAIKU_TOP/build/jam/repositories/HaikuPortsLocal/arm64" ]; then
            pin=$(sed -e 's/#.*//' "$HAIKU_TOP/build/jam/repositories/HaikuPortsLocal/arm64" \
              | tr -d '[:blank:]' | grep -E "^${pkg}-[0-9]" | head -1)
          fi
          if [ -n "$pin" ]; then
            if [ ! -f "$HG_POOL_DIR/$pin-arm64.hpkg" ] && [ ! -f "$HG_POOL_DIR/$pin-any.hpkg" ]; then
              missing="$missing $pin-{arm64,any}.hpkg"
            fi
          else
            ls "$HG_POOL_DIR/${pkg}"-[0-9]*.hpkg >/dev/null 2>&1 || missing="$missing $pkg"
          fi
        done
        # The <hg-pool> force-adds cannot be checked by the loop above, because a
        # name-only glob cannot tell the two ncurses6 builds apart:
        # `ncurses6-[0-9]*` matches ncurses6-6.6_bootstrap-1 exactly as happily
        # as ncurses6-6.6-1, and the bootstrap one IS the defect (issue 784). So
        # check the exact filename, and read it out of UserBuildConfig rather
        # than repeating it here, so the buildspec and the jam config cannot
        # drift apart -- the way they already had: the pin sat in a `$(HG_FATTY)`
        # block no buildspec enters, and nothing noticed.
        ncursesPin=$(sed -n 's/^[[:space:]]*local ncursesFileName = \(ncurses6-[^ ]*\.hpkg\) ;.*/\1/p' \
          "$HAIKU_TOP/graviton/ssh/UserBuildConfig" | head -1)
        if [ -z "$ncursesPin" ]; then
          echo "FATAL: could not read the ncurses6 force-add filename out of graviton/ssh/UserBuildConfig." >&2
          echo "The 'local ncursesFileName = ...' line is how this guard knows which build to require (issue 784)." >&2
          exit 1
        fi
        [ -f "$HG_POOL_DIR/$ncursesPin" ] || missing="$missing $ncursesPin"
        if [ -n "$missing" ]; then
          echo "FATAL: hpkg pool s3://$WORK_BUCKET/hpkg-pool/ did not provide required package(s):$missing" >&2
          echo "The pool is stale or mis-seeded, or a pin in build/jam/repositories/HaikuPortsLocal/arm64 moved ahead of it." >&2
          echo "Pins and pool must move together: build the package natively, upload it to s3://$WORK_BUCKET/hpkg-pool/ (additive; see issue #419), then retry the bake." >&2
          exit 1
        fi
        # Provenance (issue #846). The agent hpkg is built by hand, and the
        # name-only check above passes ANY revision, including one built before
        # the current patch. That is how PR #555's fix sat merged but unbaked
        # for 25 days (#553). check-pool requires exactly one
        # amazon_ssm_agent-* in the pool, because UserBuildConfig bakes the
        # first Glob match in readdir order. It also requires the source digest
        # stamped in that hpkg to equal the digest of THIS checkout's agent
        # patch, launch job, upstream tag and Go toolchain patches. An
        # unstamped hpkg passes only through a legacy record in
        # graviton/go-arm64/provenance-legacy/ (today: -2, which passes with a
        # WARNING that names what trunk has and the package lacks).
        python3 "$HAIKU_TOP/graviton/scripts/haiku-hpkg-provenance" check-pool \
          --package amazon_ssm_agent --top "$HAIKU_TOP" "$HG_POOL_DIR" || {
          echo "FATAL: s3://$WORK_BUCKET/hpkg-pool/ failed the amazon_ssm_agent provenance check (see above)." >&2
          exit 1
        }
        ls -la "$HG_POOL_DIR"
        # A lean bake stages only part of the HaikuPortsLocal list, so exit 1
        # ("missing from pool") is expected -- the dependent build features just
        # stay off. Exit 2 is a VENDOR problem (issue 737) and must never be
        # swallowed: package_repo create refuses a mixed-vendor set, so the whole
        # image build would die ~an hour later in RepositoryCache1 instead.
        rc=0
        ( cd "$HAIKU_TOP" && ./graviton/scripts/haiku-stage-local-packages "$GEN" "$HG_POOL_DIR" ) || rc=$?
        if [ "$rc" -ge 2 ]; then
          echo "FATAL: haiku-stage-local-packages rejected a pool package on its vendor (see above)." >&2
          echo "Re-seed hpkg-pool/ from the trunk pipeline's pool, which carries the builder's" >&2
          echo "\"Haiku Project\" stamp -- NOT from the published repo, which haiku-repo-publish" >&2
          echo "re-stamps to vendor \"DeBeOS\" for serving." >&2
          exit 1
        elif [ "$rc" -ne 0 ]; then
          echo "stage-local-packages reported missing packages (features for any un-staged pkg stay off)"
        fi
      # ---- first jam pass: stage the haiku / haiku_devel packages --------
      # build-openssh-arm64.sh reads the packages_build/minimum staging dirs,
      # which only exist after jam has assembled the base packages. This first
      # pass populates them (and produces an ssh-less image we discard).
      # ---- pre-extract build-feature archives (fixes the -isystem race) --
      # Build-feature HEADER dirs are given to the compiler only as -isystem path
      # strings, with no Jam dependency from the consuming objects to the
      # ExtractHPKGArchive1 action -- so with many header-providing features on
      # (openssl/zstd/jpeg/png/tiff/webkit + gcc_syslibs_devel) a parallel compile
      # can read a half-extracted header tree and die with a spurious
      # "stdlib.h: No such file" on a victim TU that changes every run. Draining
      # every extraction first (distinct dirs, so this pass is race-free at -j)
      # guarantees the header trees are complete before the compile storm.
      - echo "== jam pass 0 (pre-extract all build-feature archives) =="
      - HAIKU_REVISION="$HAIKU_REVISION" jam -q -j"$NPROC" haiku-extract-build-features
      - echo "== jam pass 1 (@minimum-mmc, stages packages) =="
      - HAIKU_REVISION="$HAIKU_REVISION" jam -q -j"$NPROC" @minimum-mmc
      # ---- cross-build OpenSSH -> hpkg + image files ---------------------
      - echo "== build-openssh-arm64.sh =="
      - mkdir -p "$HG_SSH_DIR"
      - HAIKU_TOP="$HAIKU_TOP" GEN="$GEN" OUT="$HG_SSH_DIR" bash "$HAIKU_TOP/graviton/ssh/build-openssh-arm64.sh"
      # Stage the desktop/cloud-init image files the UserBuildConfig also expects
      # (build-openssh only emits the ssh subset; copy the rest from the recipe).
      - |
        for f in launch-cloud-init remote-desktop.sh launch-remote-desktop UserSetupEnvironment cargo-config.toml launch-partition-grow partition-grow.sh; do
          cp "$HAIKU_TOP/graviton/ssh/files/$f" "$HG_SSH_DIR/image/$f"
        done
      # ---- re-vendor the baked SYSTEM packages to "DeBeOS" (issue #39) ---
      # The DeBeOS repo is single-vendor: haiku-repo-publish re-stamps every repo
      # hpkg to vendor "DeBeOS" (package_repo create refuses a mixed-vendor set).
      # But the base image still ships bootstrap/system packages stamped vendor
      # "Haiku Project" (gcc_syslibs, gcc_syslibs_devel, zlib_bootstrap, freetype,
      # icu, ca_root_certificates, ...). When `pkgman install <repo pkg>` on a
      # provisioned builder supersedes one of those (e.g. the toolchain, or curl
      # needing a newer lib:libz), the vendor mismatch forces an "allow vendor
      # change" that reshuffles the gcc/gcc_syslibs/gcc_syslibs_devel trio and
      # breaks the gcc-driver<->cc1 pairing ("gcc: fatal error: cannot execute
      # 'cc1'"). Re-stamping the baked packages to "DeBeOS" here -- a metadata-only
      # repack (extract -> rewrite the vendor line -> recreate the identical tree;
      # contents/version/dependencies untouched) -- makes the running OS match the
      # repo so no vendor change is ever needed. jam pass 1 above has populated
      # $GEN/download with every fetched/staged system package; pass 2 below copies
      # them verbatim into system/packages (build_haiku_image reuses a present file,
      # never re-hashing it), so re-stamping now is picked up by the final image.
      #
      # EXCLUSION: the HaikuPortsLocal set (openssl3/zstd/... -- see
      # build/jam/repositories/HaikuPortsLocal) is fed to `package_repo create`
      # during pass 2 to build the local solver cache against the HaikuPorts
      # repo.info (vendor "Haiku Project"); create aborts B_BAD_DATA on any package
      # whose vendor disagrees, so those must stay as-is. They remain a latent
      # supersede path (tracked on #39) whose clean fix needs a DeBeOS-vendored
      # local repo.info (interacts with #201) -- out of scope for this metadata
      # re-stamp. The mirror-downloaded bootstrap packages (the named culprits) are
      # never fed to package_repo create, so re-stamping them is bake-safe.
      - |
        echo "== re-vendor baked system packages -> DeBeOS (#39) =="
        # Host `package` tool built by the jam pass (Linux, not Haiku): it is
        # dynamically linked against the *_build.so and license-checks against a
        # system data dir -- point LD_LIBRARY_PATH and HAIKU_BUILD_SYSTEM_DATA_
        # DIRECTORY at the in-tree copies (same relocation the no-metal publisher
        # uses for the banked tools).
        PKG_BIN="$(find "$GEN/objects/linux" -path '*/release/tools/package/package' -type f 2>/dev/null | head -1)"
        test -x "$PKG_BIN" || { echo "no host 'package' tool under $GEN/objects/linux" >&2; exit 1; }
        LDP=""
        for d in $(find "$GEN/objects/linux" -name '*_build.so' -type f -exec dirname {} \; 2>/dev/null | sort -u); do
          LDP="$d:$LDP"
        done
        export LD_LIBRARY_PATH="${LDP}${LD_LIBRARY_PATH:-}"
        export HAIKU_BUILD_SYSTEM_DATA_DIRECTORY="$HAIKU_TOP/data/system/data"
        # Derive the HaikuPortsLocal exclusions from the list itself (same parse as
        # haiku-stage-local-packages) so the two cannot drift apart; strip the
        # -<version>-<revision> tail to the base package name revendor matches on.
        EXCL_ARGS=""
        LOCAL_LIST="$HAIKU_TOP/build/jam/repositories/HaikuPortsLocal/arm64"
        if [ -f "$LOCAL_LIST" ]; then
          for spec in $(sed -e 's/#.*//' "$LOCAL_LIST" \
              | grep -Ev '^[[:space:]]*(LocalPackageRepository|:|;|$)' \
              | tr -d '[:blank:]' | grep -E '^[A-Za-z0-9_]+-'); do
            name="$(printf '%s\n' "$spec" | sed -E 's/-[0-9].*$//')"
            [ -n "$name" ] && EXCL_ARGS="$EXCL_ARGS --exclude $name"
          done
        fi
        echo "revendor excludes:$EXCL_ARGS"
        "$HAIKU_TOP/graviton/scripts/haiku-repo-publish" revendor \
          --dir "$GEN/download" --package-tool "$PKG_BIN" $EXCL_ARGS
      # ---- inject the UserBuildConfig hook + second jam pass -------------
      # HAIKU_IMAGE_SIZE (MiB) is the baked BFS root size. The root now auto-grows
      # to a larger root disk: the arm64 image is formatted with grow-headroom
      # (bfsGrowHeadroom), first-boot partition_grow expands the root GPT partition
      # to fill the disk, and the BFS mount-time engine grows the filesystem into
      # the enlarged partition on the next mount -- so a bigger EBS is used, not
      # wasted. This baked size still needs to cover the full-parity closure
      # (WebKit + Rust + dev toolchain + base, ~1.7 GiB) AND leave real dev
      # headroom -- several debug `target/` trees at ~2-4 GiB each. 19000 MiB
      # (~18.6 GiB) leaves ~16 GiB free even without growing. It MUST stay under
      # ROOT_VOLUME_BYTES (20 GiB, cdk.json) so make-gpt-image can grow the mmc
      # into the raw (raw >= mmc). NOTE: import-snapshot time scales with image
      # size, so this bake is slower than the 10 GiB one; don't grow it further
      # without cause. SSH-only bakes are unaffected.
      - echo "== inject UserBuildConfig, jam pass 2 (final image with ssh) =="
      - cp "$HAIKU_TOP/graviton/ssh/UserBuildConfig" "$GEN/UserBuildConfig"
      - HG_POOL_DIR="${HG_POOL_DIR:-}" HG_SSH_DIR="$HG_SSH_DIR" HAIKU_REVISION="$HAIKU_REVISION" jam -q -j"$NPROC" -sHAIKU_IMAGE_SIZE=19000 @minimum-mmc
      # ---- MBR mmc -> GPT raw --------------------------------------------
      - echo "== make-gpt-image.sh (MBR -> GPT) =="
      - MMC="$(ls -1 "$GEN"/haiku-mmc.image "$GEN"/haiku-*.mmc "$GEN"/haiku-minimum.mmc 2>/dev/null | head -1)"
      - |
        [ -n "$MMC" ] || MMC="$(find "$GEN" -maxdepth 2 \( -name 'haiku-mmc.image' -o -name 'haiku-*.mmc' \) 2>/dev/null | head -1)"
        test -n "$MMC" || { echo "no mmc/sd image produced by jam" >&2; ls -l "$GEN"/*.image "$GEN"/*.mmc 2>/dev/null || true; exit 1; }
        echo "mmc image: $MMC"
      - bash "$HAIKU_TOP/graviton/builder/make-gpt-image.sh" "$MMC" "$HAIKU_TOP/haiku-ec2.raw" "$ROOT_VOLUME_BYTES"
  post_build:
    commands:
      - export HAIKU_TOP="$CODEBUILD_SRC_DIR"
      - export GEN="$HAIKU_TOP/$GEN_SUBDIR"
      # Archive THIS build's haiku_devel so promotion can publish the exact
      # version-matched develop package to the DeBeOS repo. haiku_devel is
      # version-locked (`requires haiku == <hrev>`), so the repo copy must match
      # whatever `haiku` the canonical AMI ships -- otherwise `pkgman install
      # haiku_devel` would try to change the base (the same brick vector as the
      # upstream-repo swap). Keyed by HAIKU_REVISION under the cache/ prefix
      # (already writable by this role -- no extra IAM). haiku-devel-publish, run
      # from promote, fetches this exact object. Best-effort: a missing devel
      # archive must never fail a bake (the repo keeps its prior, matching copy).
      - |
        DEVEL_HPKG="$(find "$GEN" -name 'haiku_devel-*.hpkg' -o -name 'haiku_devel.hpkg' 2>/dev/null | head -1)"
        if [ -n "$DEVEL_HPKG" ] && [ -n "${HAIKU_REVISION:-}" ]; then
          DKEY="$CACHE_PREFIX/devel-closure/haiku_devel-${HAIKU_REVISION}-arm64.hpkg"
          echo "== archiving haiku_devel ($DEVEL_HPKG) -> s3://$WORK_BUCKET/$DKEY =="
          aws s3 cp "$DEVEL_HPKG" "s3://$WORK_BUCKET/$DKEY" \
            --region "$AWS_DEFAULT_REGION" || echo "haiku_devel archive upload failed (non-fatal)"
        else
          echo "WARNING: no haiku_devel hpkg found under $GEN to archive (or HAIKU_REVISION unset)"
        fi
      # Refresh the cross-tools cache (cheap insurance; overwrites on every run).
      # Uses the SAME buildtools-revision-keyed name written to /tmp/ct.env in
      # pre_build, so a given buildtools commit always maps to exactly one cache
      # object (restore and refresh cannot drift).
      - |
        if [ -x "$GEN/cross-tools-arm64/bin/aarch64-unknown-haiku-gcc" ]; then
          . /tmp/ct.env
          echo "== caching cross-tools ($CT_CACHE) =="
          tar --zstd -cf /tmp/ct.tar.zst -C "$GEN" cross-tools-arm64
          aws s3 cp /tmp/ct.tar.zst "$CT_CACHE" \
            --region "$AWS_DEFAULT_REGION" || echo "cross-tools cache upload failed (non-fatal)"
        fi
      # Bank the LINUX host-tools `package` and `package_repo`. These are byproducts
      # of the jam build (built for the CodeBuild host, not for Haiku) and are what
      # haiku-repo-add / haiku-repo-publish need to (re)build the DeBeOS repo index.
      # The retired metal ran them on Linux; the no-metal publisher (an ephemeral
      # Ubuntu peer, see #68) fetches them from here instead of rebuilding a whole
      # tree. Keyed under host-tools/ with a .arch marker so the publisher matches
      # the CodeBuild host arch. Best-effort: never fail a bake over this.
      - |
        HT="$CACHE_PREFIX/host-tools"
        PKG_BIN="$(find "$GEN/objects/linux" -path '*/release/tools/package/package' -type f 2>/dev/null | head -1)"
        PR_BIN="$(find "$GEN/objects/linux" -path '*/release/tools/package_repo/package_repo' -type f 2>/dev/null | head -1)"
        if [ -x "$PKG_BIN" ] && [ -x "$PR_BIN" ]; then
          echo "== banking host tools ($(uname -m)) -> s3://$WORK_BUCKET/$HT/ =="
          uname -m > /tmp/host-tools.arch
          aws s3 cp "$PKG_BIN" "s3://$WORK_BUCKET/$HT/package" --region "$AWS_DEFAULT_REGION" || echo "package upload failed (non-fatal)"
          aws s3 cp "$PR_BIN"  "s3://$WORK_BUCKET/$HT/package_repo" --region "$AWS_DEFAULT_REGION" || echo "package_repo upload failed (non-fatal)"
          aws s3 cp /tmp/host-tools.arch "s3://$WORK_BUCKET/$HT/.arch" --region "$AWS_DEFAULT_REGION" || true
          # The tools are dynamically linked against Haiku's build shared libs
          # (libroot_build.so, libpackage_build.so, libbe_build.so, ...), which are
          # NOT system libraries -- `ldd package_repo` on a stock Ubuntu box shows
          # them "not found" and the tool aborts "error while loading shared
          # libraries: libroot_build.so". Bank every *_build.so from the host lib
          # dir alongside the binaries; the publisher runs them with
          # LD_LIBRARY_PATH pointed at the fetched set.
          nlibs=0
          for so in $(find "$GEN/objects/linux" -name '*_build.so' -type f 2>/dev/null); do
            aws s3 cp "$so" "s3://$WORK_BUCKET/$HT/lib/$(basename "$so")" --region "$AWS_DEFAULT_REGION" \
              && nlibs=$((nlibs+1)) || echo "lib $(basename "$so") upload failed (non-fatal)"
          done
          echo "== banked $nlibs host build lib(s) -> s3://$WORK_BUCKET/$HT/lib/ =="
          # The `package` tool license-checks against a system data dir holding
          # licenses/. Bank the source tree's data/system/data/licenses so a
          # relocated tool can be pointed at it via the HAIKU_BUILD_SYSTEM_DATA_
          # DIRECTORY env override (added to PackageWriterImpl). Without it,
          # `package create` aborts "unable to find system data path".
          if [ -d "$HAIKU_TOP/data/system/data/licenses" ]; then
            aws s3 cp "$HAIKU_TOP/data/system/data/licenses" "s3://$WORK_BUCKET/$HT/data/licenses" \
              --recursive --region "$AWS_DEFAULT_REGION" \
              && echo "== banked licenses -> s3://$WORK_BUCKET/$HT/data/licenses/ ==" \
              || echo "licenses upload failed (non-fatal)"
          else
            echo "WARNING: no data/system/data/licenses under $HAIKU_TOP to bank"
          fi
        else
          echo "WARNING: host tools not found under $GEN/objects/linux (package=$PKG_BIN package_repo=$PR_BIN)"
        fi
      - |
        ls -l "$HAIKU_TOP/haiku-ec2.raw" || echo "WARNING: raw image missing"

artifacts:
  files:
    - haiku-ec2.raw
  name: raw-image
